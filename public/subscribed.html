<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ご登録ありがとうございます｜kishinoArtworks</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Kit の確認メールで「登録する」を押したあとに開くページ。
         配色は src/index.css と同じ値（このページは Vite を通らないので直接書く） -->
    <style>
      :root {
        --bg: #faf8f4;
        --bg-deep: #f1ebe1;
        --surface: #ffffff;
        --primary: #6b7d5a;
        --primary-hover: #5a6b4a;
        --primary-deep: #414d36;
        --text-main: #3b3630;
        --text-muted: #8a8177;
        --border: #e6dfd3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: linear-gradient(160deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text-main);
        font-family: 'Yu Gothic UI', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
        line-height: 1.7;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .card {
        width: 100%;
        max-width: 520px;
        padding: 40px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(90, 74, 50, 0.08);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e7ecdf;
        color: var(--primary);
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        color: var(--primary-deep);
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--text-muted);
        font-size: 15px;
      }
      /* 1つの span が1行。幅が足りないときだけ文節で折り返す */
      p span { display: block; word-break: auto-phrase; }
      /* 狭い画面では「の」のあとで折り返す */
      p i { display: inline-block; font-style: normal; }
      a.back {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      a.back:hover { background: var(--primary-hover); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">✓</div>
      <h1>ご登録が完了しました</h1>
      <p>
        <span>「AIと便利ツールの実験工房」から、</span>
        <span>便利ツールの公開・アップデート情報や、</span>
        <span><i>キャラクターbot「AI理玄」の</i><i>育成記録をお知らせします。</i></span>
      </p>
      <a class="back" href="./" title="画像変幻コンバーターを開きます">画像変幻コンバーターへ</a>
    </main>
  </body>
</html>
